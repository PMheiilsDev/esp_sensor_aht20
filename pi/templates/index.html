<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Temperature & Battery Monitor</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Date/time support for Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-top: 0;
        }

        .controls {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;

            display: flex;
            gap: 15px;
            align-items: end;
            flex-wrap: wrap;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
        }

        input,
        button {
            font-size: 16px;
            padding: 7px 10px;
        }

        button {
            cursor: pointer;
        }

        .status {
            margin-left: auto;
            color: #666;
            font-size: 14px;
        }

        .chart-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .chart-container {
            position: relative;
            height: 500px;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            color: #666;
        }

        .error {
            background: #ffd6d6;
            color: #800000;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>


<body>

    <h1>Temperature & Battery Monitor</h1>


    <!-- =====================================================
         Controls
         ===================================================== -->

    <div class="controls">

        <div class="control">

            <label for="start">
                From
            </label>

            <input type="datetime-local" id="start"
                min="{{ min_date }}"
                max="{{ max_date }}"
                value="{{ default_start }}">

        </div>


        <div class="control">

            <label for="end">
                To
            </label>

            <input type="datetime-local" id="end"
                min="{{ min_date }}"
                max="{{ max_date }}"
                value="{{ default_end }}">

        </div>


        <button type="button" onclick="changeDateRange()">
            Update
        </button>


        <div class="status" id="status">
            Loading...
        </div>

    </div>


    <!-- =====================================================
         Chart
         ===================================================== -->

    <div id="charts">

        <div class="message">
            Loading data...
        </div>

    </div>


    <script>

        /*
         * =====================================================
         * Global state
         * =====================================================
         */

        let chart = null;

        /*
         * Version received from Flask.
         *
         * This is the ETag of data.txt.
         *
         * If the file hasn't changed, Flask returns HTTP 304
         * and doesn't transmit the graph data again.
         */
        let dataVersion = null;

        /*
         * Prevent two requests from running at the same time.
         */
        let updateInProgress = false;


        let endManuallyChanged = false;

        /*
         * =====================================================
         * Update status text
         * =====================================================
         */

        function setStatus(text) {

            document.getElementById("status").textContent = text;

        }


        /*
         * =====================================================
         * User changed the date range
         * =====================================================
         */

        function changeDateRange() {

            /*
             * The date range changed, so the previous ETag
             * cannot be trusted for this request.
             *
             * Force a complete request.
             */
            endManuallyChanged = true;

            dataVersion = null;

            loadCharts(true);

        }


        /*
         * =====================================================
         * Load data from Flask
         * =====================================================
         */

        async function loadCharts(force = false) {

            /*
             * Don't start another request while one is running.
             */
            if (updateInProgress) {
                return;
            }


            const start =
                document.getElementById("start").value;

            const end =
                document.getElementById("end").value;


            /*
             * Make sure dates exist.
             */
            if (!start || !end) {

                setStatus("Select a date range");

                return;
            }


            /*
             * Validate date range.
             */
            if (start > end) {

                setStatus("Invalid date range");

                alert(
                    "Start date must be before or equal to end date."
                );

                return;
            }


            updateInProgress = true;


            try {

                /*
                 * Headers sent to Flask.
                 */
                const headers = {};


                /*
                 * If we already have the current version,
                 * tell Flask about it.
                 *
                 * Flask can then return:
                 *
                 *     304 Not Modified
                 *
                 * without sending the data again.
                 */
                if (!force && dataVersion !== null) {

                    headers["If-None-Match"] =
                        dataVersion;

                }


                setStatus("Checking for updates...");


                /*
                 * Request data.
                 */
                let url =
                    `/api/data?start=${encodeURIComponent(start)}`;

                if (endManuallyChanged) {
                    url += `&end=${encodeURIComponent(end)}`;
                }

                const response = await fetch(
                    url,
                    {
                        method: "GET",
                        headers: headers,
                        cache: "no-store"
                    }
                );


                /*
                 * =================================================
                 * Nothing changed
                 * =================================================
                 */

                if (response.status === 304) {

                    setStatus(
                        "No changes · " +
                        new Date().toLocaleTimeString()
                    );

                    console.log(
                        "Data unchanged."
                    );

                    return;
                }


                /*
                 * =================================================
                 * HTTP error
                 * =================================================
                 */

                if (!response.ok) {

                    throw new Error(
                        `Server returned HTTP ${response.status}`
                    );

                }


                /*
                 * =================================================
                 * Data changed
                 * =================================================
                 */

                /*
                 * Save the new ETag.
                 */
                dataVersion =
                    response.headers.get("ETag");


                /*
                 * Read JSON data.
                 */
                const values =
                    await response.json();

                if (!endManuallyChanged && values.length > 0) {
                    const newestTime = new Date(values[values.length - 1].time);
                    newestTime.setMinutes(newestTime.getMinutes() + 1);

                    const pad = n => String(n).padStart(2, "0");

                    document.getElementById("end").value =
                        `${newestTime.getFullYear()}-${pad(newestTime.getMonth() + 1)}-${pad(newestTime.getDate())}T${pad(newestTime.getHours())}:${pad(newestTime.getMinutes())}`;
                }

                console.log(
                    "Received",
                    values.length,
                    "points"
                );


                /*
                 * Draw the graph.
                 */
                drawChart(values);


                setStatus(
                    "Updated · " +
                    new Date().toLocaleTimeString()
                );


            } catch (error) {

                console.error(
                    "Failed to update data:",
                    error
                );


                setStatus(
                    "Update failed"
                );


                /*
                 * Show error only if there isn't already
                 * a graph displayed.
                 */
                if (!chart) {

                    document.getElementById(
                        "charts"
                    ).innerHTML = `

                        <div class="error">

                            Failed to load data:
                            ${escapeHtml(error.message)}

                        </div>

                    `;

                }

            } finally {

                updateInProgress = false;

            }

        }


        /*
         * =====================================================
         * Draw the graph
         * =====================================================
         */

        function drawChart(values) {


            /*
             * Destroy previous Chart.js graph.
             */
            if (chart) {

                chart.destroy();

                chart = null;

            }


            const container =
                document.getElementById("charts");


            /*
             * No data.
             */
            if (values.length === 0) {

                container.innerHTML = `

                    <div class="message">

                        No data found for the selected
                        date range.

                    </div>

                `;

                return;

            }


            /*
             * Create chart container.
             */
            container.innerHTML = `

                <div class="chart-card">

                    <h2>
                        ${escapeHtml(
                document.getElementById("start").value
            )}
                        →
                        ${escapeHtml(
                document.getElementById("end").value
            )}
                    </h2>

                    <div class="chart-container">

                        <canvas id="mainChart"></canvas>

                    </div>

                </div>

            `;


            /*
             * =================================================
             * Temperature data
             * =================================================
             */

            const temperatureData =
                values.map(item => ({

                    x: new Date(item.time),

                    y: item.temperature

                }));

            /*
            * =================================================
            * Humidity data
            * =================================================
            */

            const humidityData =
                values.map(item => ({

                    x: new Date(item.time),

                    y: item.humidity

                }));


            /*
             * =================================================
             * Voltage line segments
             *
             * Each segment gets its own color depending on
             * power_save.
             *
             * blue = false
             * red  = true
             * =================================================
             */

            const voltageDatasets = [];


            for (
                let i = 0;
                i < values.length - 1;
                i++
            ) {

                const color =
                    values[i].power_save
                        ? "red"
                        : "blue";


                voltageDatasets.push({

                    /*
                     * Empty label because these are individual
                     * line segments.
                     */
                    label: "",

                    data: [

                        {
                            x: new Date(
                                values[i].time
                            ),

                            y: values[i].vbat
                        },

                        {
                            x: new Date(
                                values[i + 1].time
                            ),

                            y: values[i + 1].vbat
                        }

                    ],

                    borderColor: color,

                    backgroundColor: color,

                    borderWidth: 2,

                    pointRadius: 0,

                    pointHoverRadius: 0,

                    fill: false,

                    tension: 0,

                    yAxisID: "voltage"

                });

            }


            /*
             * =================================================
             * Voltage points
             * =================================================
             */

            const voltagePoints =
                values.map(item => ({

                    x: new Date(item.time),

                    y: item.vbat,

                    powerSave: item.power_save

                }));


            voltageDatasets.push({

                label: "Voltage",

                data: voltagePoints,

                borderColor: "transparent",

                backgroundColor: context => {

                    const point =
                        context.raw;


                    if (!point) {
                        return "blue";
                    }


                    return point.powerSave
                        ? "red"
                        : "blue";

                },

                pointRadius: 4,

                pointHoverRadius: 7,

                showLine: false,

                yAxisID: "voltage"

            });


            /*
             * =================================================
             * Create Chart.js graph
             * =================================================
             */

            const canvas =
                document.getElementById(
                    "mainChart"
                );


            chart = new Chart(

                canvas,

                {

                    type: "line",


                    data: {

                        datasets: [

                            /*
                             * ---------------------------------
                             * Temperature
                             * ---------------------------------
                             */

                            {

                                label: "Temperature",

                                data:
                                    temperatureData,

                                borderColor: "green",

                                backgroundColor:
                                    "green",

                                borderWidth: 1.5,

                                pointRadius: 3,

                                pointHoverRadius: 6,

                                yAxisID:
                                    "temperature",

                                tension: 0,

                                fill: false

                            },


                            /*
                            * ---------------------------------
                            * Humidity
                            * ---------------------------------
                            */
                            {

                                label: "Humidity",

                                data: humidityData,

                                borderColor: "gray",

                                backgroundColor: "gray",

                                borderWidth: 1.5,

                                pointRadius: 3,

                                pointHoverRadius: 6,

                                yAxisID: "humidity",

                                tension: 0,

                                fill: false

                            },

                            /*
                             * ---------------------------------
                             * Voltage
                             * ---------------------------------
                             */

                            ...voltageDatasets

                        ]

                    },


                    options: {

                        responsive: true,

                        maintainAspectRatio: false,


                        /*
                         * Show the nearest point when
                         * hovering.
                         */
                        interaction: {

                            mode: "nearest",

                            intersect: false

                        },


                        plugins: {


                            /*
                             * ---------------------------------
                             * Legend
                             * ---------------------------------
                             */

                            legend: {

                                labels: {

                                    filter: function (item) {

                                        return (
                                            item.text === "Temperature" ||
                                            item.text === "Humidity" ||
                                            item.text === "Voltage"
                                        );

                                    }

                                },

                                onClick: function (event, legendItem, legend) {

                                    const chart = legend.chart;

                                    if (legendItem.text === "Temperature") {

                                        const temperatureDataset =
                                            chart.data.datasets.find(
                                                dataset =>
                                                    dataset.label === "Temperature"
                                            );

                                        if (temperatureDataset) {

                                            temperatureDataset.hidden =
                                                !temperatureDataset.hidden;

                                        }

                                    }


                                    if (legendItem.text === "Voltage") {

                                        /*
                                         * Toggle ALL voltage datasets:
                                         *
                                         * - colored voltage line segments
                                         * - voltage marker dataset
                                         */

                                        const voltageDatasets =
                                            chart.data.datasets.filter(
                                                dataset =>
                                                    dataset.yAxisID === "voltage"
                                            );


                                        /*
                                         * Determine the new visibility from the
                                         * first voltage dataset.
                                         */

                                        const shouldHide =
                                            !voltageDatasets.some(
                                                dataset => dataset.hidden
                                            );


                                        voltageDatasets.forEach(
                                            dataset => {

                                                dataset.hidden = shouldHide;

                                            }
                                        );

                                    }

                                    if (legendItem.text === "Humidity") {

                                        const humidityDataset =
                                            chart.data.datasets.find(
                                                dataset =>
                                                    dataset.label === "Humidity"
                                            );

                                        if (humidityDataset) {

                                            humidityDataset.hidden =
                                                !humidityDataset.hidden;

                                        }

                                    }

                                    chart.update();

                                }

                            },


                            /*
                             * ---------------------------------
                             * Tooltip
                             * ---------------------------------
                             */

                            tooltip: {

                                callbacks: {

                                    title:
                                        function (context) {

                                            if (
                                                !context.length
                                            ) {
                                                return "";
                                            }


                                            const date =
                                                new Date(
                                                    context[0]
                                                        .parsed
                                                        .x
                                                );


                                            return date
                                                .toLocaleString();

                                        },


                                    label:
                                        function (context) {


                                            /*
                                             * Temperature
                                             */

                                            if (
                                                context.dataset
                                                    .label ===
                                                "Temperature"
                                            ) {

                                                return (

                                                    "Temperature: " +

                                                    context.parsed
                                                        .y
                                                        .toFixed(1) +

                                                    " °C"

                                                );

                                            }

                                            /*
                                            * Humidity
                                            */

                                            if (
                                                context.dataset.label ===
                                                "Humidity"
                                            ) {

                                                return (

                                                    "Humidity: " +

                                                    context.parsed.y.toFixed(1) +

                                                    " %"

                                                );

                                            }

                                            /*
                                             * Voltage
                                             */

                                            if (
                                                context.dataset
                                                    .label ===
                                                "Voltage"
                                            ) {

                                                const powerSave =
                                                    context.raw
                                                        .powerSave;


                                                return [

                                                    "Voltage: " +

                                                    context.parsed
                                                        .y
                                                        .toFixed(3) +

                                                    " V",

                                                    "Power save: " +

                                                    powerSave

                                                ];

                                            }


                                            return null;

                                        }

                                }

                            }

                        },


                        scales: {


                            /*
                             * ---------------------------------
                             * X axis
                             * ---------------------------------
                             */

                            x: {

                                type: "time",

                                time: {

                                    /*
                                     * Chart.js automatically
                                     * chooses the appropriate
                                     * unit depending on the
                                     * selected range.
                                     */

                                    tooltipFormat:
                                        "yyyy-MM-dd HH:mm:ss",

                                    displayFormats: {

                                        millisecond:
                                            "HH:mm:ss",

                                        second:
                                            "HH:mm:ss",

                                        minute:
                                            "HH:mm",

                                        hour:
                                            "MM-dd HH:mm",

                                        day:
                                            "yyyy-MM-dd",

                                        week:
                                            "yyyy-MM-dd",

                                        month:
                                            "yyyy-MM"

                                    }

                                },


                                title: {

                                    display: true,

                                    text: "Time"

                                }

                            },


                            /*
                             * ---------------------------------
                             * Temperature axis
                             * ---------------------------------
                             */

                            temperature: {

                                type: "linear",

                                position: "left",


                                title: {

                                    display: true,

                                    text:
                                        "Temperature (°C)"

                                },


                                ticks: {

                                    color: "green"

                                }

                            },

                            /*
                            * ---------------------------------
                            * Humidity axis
                            * ---------------------------------
                            */

                            humidity: {

                                type: "linear",

                                position: "right",

                                title: {

                                    display: true,

                                    text: "Humidity (%)"

                                },

                                ticks: {

                                    color: "gray"

                                },

                                min: 0,

                                max: 100,

                                grid: {

                                    drawOnChartArea: false

                                }

                            },


                            /*
                             * ---------------------------------
                             * Voltage axis
                             * ---------------------------------
                             */

                            voltage: {

                                type: "linear",

                                position: "right",


                                title: {

                                    display: true,

                                    text:
                                        "Battery Voltage (V)"

                                },


                                grid: {

                                    drawOnChartArea:
                                        false

                                }

                            }

                        }

                    }

                }

            );

        }


        /*
         * =====================================================
         * Escape HTML
         *
         * Used for values inserted into HTML.
         * =====================================================
         */

        function escapeHtml(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value;

            return div.innerHTML;

        }


        /*
         * =====================================================
         * Initial load
         * =====================================================
         *
         * "true" means don't use a previous ETag because
         * this is the first request.
         */

        loadCharts(true);


        /*
         * =====================================================
         * Automatic update
         * =====================================================
         *
         * Check once every 60 seconds.
         *
         * If data.txt hasn't changed:
         *
         *     Flask -> HTTP 304
         *
         * No JSON data is transmitted.
         *
         * If data.txt changed:
         *
         *     Flask -> new JSON
         *
         * Graph is redrawn.
         */

        setInterval(

            function () {

                loadCharts(false);

            },

            30 * 1000

        );

    </script>

</body>

</html>
