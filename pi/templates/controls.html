<div class="controls">

    <div class="control">

        <label for="start">
            From
        </label>

        <input type="datetime-local" id="start"
            min="{{ min_date }}"
            max="{{ max_date }}"
            value="{{ default_start }}">

    </div>


    <div class="control">

        <label for="end">
            To
        </label>

        <input type="datetime-local" id="end"
            min="{{ min_date }}"
            max="{{ max_date }}"
            value="{{ default_end }}">

    </div>


    <div class="control">

        <label for="samples">
            Target Samples
        </label>

        <select id="samples" onchange="changeDateRange()">
            <option value="100">100 points</option>
            <option value="250">250 points</option>
            <option value="500" selected>500 points (Default)</option>
            <option value="1000">1000 points</option>
            <option value="2000">2000 points</option>
        </select>

    </div>


    <div class="control" style="flex-direction: row; align-items: center; gap: 8px; margin-bottom: 5px;">

        <input type="checkbox" id="keep_raw" onchange="changeDateRange()" checked>

        <label for="keep_raw" style="cursor: pointer;">
            Keep Recent Points Raw
        </label>

    </div>


    <button type="button" onclick="changeDateRange()">
        Update
    </button>


    <div class="status" id="status">
        Loading...
    </div>

</div>
