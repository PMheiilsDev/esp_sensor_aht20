<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Temperature & Battery Monitor{% endblock %}</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Date/time support for Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-top: 0;
        }

        .controls {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;

            display: flex;
            gap: 15px;
            align-items: end;
            flex-wrap: wrap;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: bold;
        }

        input,
        button {
            font-size: 16px;
            padding: 7px 10px;
        }

        button {
            cursor: pointer;
        }

        .status {
            margin-left: auto;
            color: #666;
            font-size: 14px;
        }

        .chart-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .chart-container {
            position: relative;
            height: 500px;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            color: #666;
        }

        .error {
            background: #ffd6d6;
            color: #800000;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    {% block content %}
    {% endblock %}
</body>

</html>
